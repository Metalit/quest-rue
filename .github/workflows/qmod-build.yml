name: Build Qmod

env:
  module_id: questeditor
  qmodName: Quest Editor

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./qmod

    steps:
      - uses: actions/checkout@v5
        name: Checkout
        with:
          submodules: true
          lfs: true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Configure CPM cache path
        run: |
          echo "CPM_SOURCE_CACHE=$HOME/.cache/CPM" >> $GITHUB_ENV

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: ${{ runner.os }}-cpm-packages-${{ hashFiles('**/CMakeLists.txt', 'CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-cpm-packages-

      - name: Setup older NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: false

      - name: Create ndkpath.txt
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}" > ./ndkpath.txt
          cat ./ndkpath.txt

      - name: Setup QPM
        uses: Fernthedev/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          package_path: ./qmod
          restore: true
          resolve_ndk: false
          cache: true

      - name: Build & Create QMOD
        run: |
          qpm s qmod

      - name: Get Output Names
        id: names
        run: |
          pattern="*.qmod"
          files=( $pattern )
          echo QMOD="${files[0]}" >> $GITHUB_OUTPUT
          cd build
          pattern="lib${module_id}*.so"
          files=( $pattern )
          echo LIB="${files[0]}" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.names.outputs.LIB }}
          path: ./qmod/build/${{ steps.names.outputs.LIB }}
          if-no-files-found: error

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v6
        with:
          name: debug_${{ steps.names.outputs.LIB }}
          path: ./qmod/build/debug/${{ steps.names.outputs.LIB }}
          if-no-files-found: error

      - name: Upload QMOD Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.names.outputs.QMOD }}
          path: ./qmod/${{ steps.names.outputs.QMOD }}
          if-no-files-found: error
